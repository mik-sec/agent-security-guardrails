      owasp_asi: "ASI01"
      core_module: "google.adk"
      title: "Untrusted Tool Output Delimiters, Markdown Sanitizer & Opaque Errors"
      security_invariant: "External retrieval and MCP resource outputs must be wrapped in <untrusted_tool_output> delimiters with Markdown image/link sanitization and opaque error IDs."
      recommended_fix: "Register an after_tool_callback that wraps tool output (for example a wrap_tool_output() helper), and return opaque error references instead of raw exception text."
    patterns:
      - pattern-either:
          - pattern: LlmAgent(..., tools=[..., McpToolset(...), ...], ...)
          - pattern: Agent(..., tools=[..., McpToolset(...), ...], ...)
          - pattern: LlmAgent(..., tools=[..., LoadMcpResourceTool(...), ...], ...)
          - pattern: Agent(..., tools=[..., LoadMcpResourceTool(...), ...], ...)
      - pattern-not: LlmAgent(..., after_tool_callback=$CB, ...)
      - pattern-not: Agent(..., after_tool_callback=$CB, ...)

  # ----------------------------------------------------------------------------
  # L3-03: Layer 3 — Read-Only Retrieval, Constrained Toolsets & MCP Pinning
  # ----------------------------------------------------------------------------
  - id: adk-connector-unconstrained-bq-or-mcp
    message: >-
      [L3-03 | Layer 3 | adk-core] Detected a write-enabled or unconstrained ADK
      connector: `BigQueryToolConfig(write_mode=WriteMode.ALLOWED)`,
      `SpannerAdminToolset`, `OpenAPIToolset` / `RestApiTool` without
      `tool_filter`, an MCP stdio server that inherits `os.environ`, or an MCP
      server launched from an unpinned package (`-y`, `@latest`). Use
      `BigQueryToolConfig(write_mode=WriteMode.BLOCKED)`, allowlist tools with
      `tool_filter=[...]`, pass an explicit minimal `env={...}`, and pin MCP
      server package versions. SQL injection in hand-written queries is out
      of scope for this ruleset.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L3-03
      rule_pack: adk-core
      layer: "Layer 3: Tool, Data Connector & Network Safety"
      module: "google.adk"
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp_agentic: "ASI02: Tool Misuse & Exploitation"
      owasp_llm: "LLM02:2025 Sensitive Information Disclosure"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI02/ASI04"
      core_module: "google.adk.integrations.bigquery.config.BigQueryToolConfig"
      title: "Read-Only Connectors, Parameterized SQL & Tenant-Scoped MCP"
      security_invariant: "Database connectors must enforce WriteMode.BLOCKED and parameterized queries (@param); MCP toolsets must scope tool_filter and bind per-invocation tenant headers."
      recommended_fix: "Use BigQueryToolConfig(write_mode=WriteMode.BLOCKED), McpToolset(tool_filter=[...], header_provider=<per-invocation tenant headers>), explicit MCP subprocess env, and pinned MCP server versions."
    pattern-either:
      - pattern: BigQueryToolConfig(..., write_mode=WriteMode.ALLOWED, ...)
      - pattern: SpannerAdminToolset(...)
      - patterns:
          - pattern-either:
              - pattern: OpenAPIToolset(...)
              - pattern: RestApiTool(...)
          - pattern-not: OpenAPIToolset(..., tool_filter=..., ...)
          - pattern-not: OpenAPIToolset(..., require_confirmation=..., ...)
          - pattern-not: RestApiTool(..., tool_filter=..., ...)
          - pattern-not: RestApiTool(..., require_confirmation=..., ...)
      - pattern: StdioServerParameters(..., env=os.environ, ...)
      - pattern: StdioServerParameters(..., env=os.environ.copy(), ...)
      - pattern: StdioServerParameters(..., env=dict(os.environ), ...)
      - pattern: 'StdioServerParameters(..., env={**os.environ, ...}, ...)'
      - pattern: StdioConnectionParams(..., env=os.environ, ...)
      - pattern: StdioConnectionParams(..., env=os.environ.copy(), ...)
      - pattern: StdioConnectionParams(..., env=dict(os.environ), ...)
      - pattern: 'StdioConnectionParams(..., env={**os.environ, ...}, ...)'
      - patterns:
          - pattern-either:
              - pattern: StdioServerParameters(..., args=[..., "$ARG", ...], ...)
              - pattern: StdioConnectionParams(..., args=[..., "$ARG", ...], ...)
          - metavariable-regex:
              metavariable: $ARG
              regex: '(?i)^(?:-y|--yes|.*@latest|--(?:api[-_]?key|access[-_]?token|refresh[-_]?token|bearer[-_]?token|auth[-_]?token|oauth[-_]?token|token|password|passwd|client[-_]?secret|secret[-_]?key)(?:=.*)?)$'

  # ----------------------------------------------------------------------------
  # L3-04: Layer 3 — Browser and Computer-Use Egress Control
  # (SSRF in custom HTTP code: general SAST)
  # ----------------------------------------------------------------------------
  - id: adk-network-ssrf-unvalidated-http
    message: >-
      [L3-04 | Layer 3 | adk-core] `ComputerUseToolset` lets the model drive a
      browser to arbitrary URLs, including cloud metadata (`169.254.169.254`),
      loopback, and internal networks. Intercept navigation (for example a
      Playwright `page.route` handler) and allow only approved destinations,
      as a `validate_egress_url()` helper does for HTTP.
      SSRF in custom HTTP client code is out of scope for this ruleset.
    severity: WARNING
    languages: [python]
    metadata:
      control_id: L3-04
      rule_pack: adk-core
      layer: "Layer 3: Tool, Data Connector & Network Safety"
      module: "google.adk"
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp_agentic: "ASI02: Tool Misuse & Exploitation"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "HIGH"
      owasp_asi: "ASI02"
      core_module: "google.adk.tools.computer_use.computer_use_toolset"
      title: "SSRF-Safe Outbound HTTP Client & IDNA/Punycode Guard"
      security_invariant: "All outbound HTTP requests must validate resolved IPs against 169.254.169.254, loopback, RFC1918, NAT64, and 6to4 ranges, enforce IDNA ASCII domain allowlists, and validate redirects per hop."
      recommended_fix: "Constrain ComputerUseToolset navigation with a page.route allowlist and validate outbound URLs with an allowlist (for example a validate_egress_url() helper)."
    pattern: ComputerUseToolset(...)

  - id: adk-a2a-push-notification-no-url-validator
    message: >-
      [L3-04 | Layer 3 | adk-core] A2A push notifications are sent to
      client-supplied webhook URLs without `push_url_validator` (and forward
      client-configured `Authorization` headers), enabling Server-Side Request
      Forgery (SSRF) against loopback, RFC1918, and cloud metadata endpoints.
      Pass `push_url_validator=validate_push_notification_url` (from
      `a2a.utils.push_url_validator` in `a2a-sdk >= 1.1.4`) to
      `DefaultRequestHandler`, `DefaultRequestHandlerV2`, `LegacyRequestHandler`,
      or `BasePushNotificationSender`.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L3-04
      rule_pack: adk-core
      layer: "Layer 3: Tool, Data Connector & Network Safety"
      module: "a2a.utils.push_url_validator"
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp_agentic: "ASI02: Tool Misuse & Exploitation"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI02"
      core_module: "a2a.utils.push_url_validator"
      title: "A2A Push-Notification Webhook SSRF Validation"
      security_invariant: "A2A push-notification senders and request handlers must enforce validate_push_notification_url on client-supplied webhook URLs and never use unvalidated InMemoryPushNotifier."
      recommended_fix: "Pass push_url_validator=validate_push_notification_url (from a2a.utils.push_url_validator in a2a-sdk >= 1.1.4) to BasePushNotificationSender, DefaultRequestHandler, DefaultRequestHandlerV2, or LegacyRequestHandler, and replace InMemoryPushNotifier."
    pattern-either:
      - pattern: InMemoryPushNotifier(...)
      - pattern: $M.InMemoryPushNotifier(...)
      - pattern: BasePushNotificationSender(..., push_url_validator=None, ...)
      - pattern: $M.BasePushNotificationSender(..., push_url_validator=None, ...)
      - patterns:
          - pattern-either:
              - pattern: DefaultRequestHandler(..., push_sender=$PS, push_url_validator=None, ...)
              - pattern: $HM.DefaultRequestHandler(..., push_sender=$PS, push_url_validator=None, ...)
              - pattern: DefaultRequestHandlerV2(..., push_sender=$PS, push_url_validator=None, ...)
              - pattern: $HM.DefaultRequestHandlerV2(..., push_sender=$PS, push_url_validator=None, ...)
              - pattern: LegacyRequestHandler(..., push_sender=$PS, push_url_validator=None, ...)
              - pattern: $HM.LegacyRequestHandler(..., push_sender=$PS, push_url_validator=None, ...)
          - metavariable-regex:
              metavariable: $PS
              regex: '^(?!None$).+'
      - patterns:
          - pattern-either:
              - pattern: BasePushNotificationSender(...)
              - pattern: $M.BasePushNotificationSender(...)
          - pattern-not: BasePushNotificationSender(..., push_url_validator=$V, ...)
          - pattern-not: $M.BasePushNotificationSender(..., push_url_validator=$V, ...)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: DefaultRequestHandler(..., push_sender=..., push_url_validator=$HV, ...)
                    - pattern: $HM.DefaultRequestHandler(..., push_sender=..., push_url_validator=$HV, ...)
                    - pattern: DefaultRequestHandlerV2(..., push_sender=..., push_url_validator=$HV, ...)
                    - pattern: $HM.DefaultRequestHandlerV2(..., push_sender=..., push_url_validator=$HV, ...)
                    - pattern: LegacyRequestHandler(..., push_sender=..., push_url_validator=$HV, ...)
                    - pattern: $HM.LegacyRequestHandler(..., push_sender=..., push_url_validator=$HV, ...)
                - metavariable-regex:
                    metavariable: $HV
                    regex: '^(?!None$).+'
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        $S = $SENDER(...)
                        ...
                        <... DefaultRequestHandler(..., push_sender=$S, push_url_validator=$HV, ...) ...>
                    - pattern: |
                        $S = $SENDER(...)
                        ...
                        <... $HM.DefaultRequestHandler(..., push_sender=$S, push_url_validator=$HV, ...) ...>
                    - pattern: |
                        $S = $SENDER(...)
                        ...
                        <... DefaultRequestHandlerV2(..., push_sender=$S, push_url_validator=$HV, ...) ...>
                    - pattern: |
                        $S = $SENDER(...)
                        ...
                        <... $HM.DefaultRequestHandlerV2(..., push_sender=$S, push_url_validator=$HV, ...) ...>
                    - pattern: |
                        $S = $SENDER(...)
                        ...
                        <... LegacyRequestHandler(..., push_sender=$S, push_url_validator=$HV, ...) ...>
                    - pattern: |
                        $S = $SENDER(...)
                        ...
                        <... $HM.LegacyRequestHandler(..., push_sender=$S, push_url_validator=$HV, ...) ...>
                - metavariable-regex:
                    metavariable: $HV
                    regex: '^(?!None$).+'

