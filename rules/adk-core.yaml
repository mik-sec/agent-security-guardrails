      - pattern: RemoteA2aAgent(..., full_history_when_stateless=True, ...)
      - pattern: A2aRemoteAgentConfig(..., forward_session_id_as_context_id=True, ...)
      - pattern: $MOD.A2aRemoteAgentConfig(..., forward_session_id_as_context_id=True, ...)

