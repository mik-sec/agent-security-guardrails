  # ----------------------------------------------------------------------------
  # L4-01: Layer 4 — Sub-Agent Context Isolation & Privilege Uplift Prevention
  # ----------------------------------------------------------------------------
  - id: adk-subagent-full-context-inheritance
    message: >-
      [L4-01 | Layer 4 | adk-core] `LlmAgent` configured with `sub_agents=[...]`
      whose children lack `include_contents="none"`. Full conversation
      inheritance lets a prompt-injected sub-agent escalate privileges through
      sibling or parent agents. Set `include_contents="none"`,
      `disallow_transfer_to_peers=True`, and `disallow_transfer_to_parent=True`
      on children, and validate child `state_delta` (for example with
      a `validate_state_delta()` helper).
    severity: WARNING
    languages: [python]
    metadata:
      control_id: L4-01
      rule_pack: adk-core
      layer: "Layer 4: Sub-Agent, Sandbox & Artifact Isolation"
      module: "google.adk"
      category: security
      cwe: "CWE-269: Improper Privilege Management"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM01:2025 Prompt Injection"
      severity_tier: "HIGH"
      owasp_asi: "ASI03/ASI07"
      core_module: "google.adk.agents.LlmAgent"
      title: "Sub-Agent Context Isolation & Privilege Uplift Prevention"
      security_invariant: "Sub-agents must set include_contents='none' and disallow_transfer_to_peers=True, satisfy zero privilege uplift (Delta = C(s_n) \\ C(a) = empty set), and filter child state_delta."
      recommended_fix: "Configure child LlmAgent(include_contents='none', disallow_transfer_to_peers=True) and filter child state_delta via validate_state_delta()."
    patterns:
      - pattern-either:
          - pattern: LlmAgent(..., sub_agents=[..., LlmAgent(...), ...], ...)
          - pattern: Agent(..., sub_agents=[..., Agent(...), ...], ...)
      - pattern-not: LlmAgent(..., sub_agents=[..., LlmAgent(..., include_contents="none", ...), ...], ...)
      - pattern-not: Agent(..., sub_agents=[..., Agent(..., include_contents="none", ...), ...], ...)

