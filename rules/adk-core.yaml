  - id: adk-server-wildcard-cors-origin-cli
    message: >-
      [L2-03 | Layer 2 | adk-core] `adk web` or `adk api_server` is invoked with
      `--allow_origins "*"`, which disables ADK's Origin check and DNS-rebinding
      protection and reflects arbitrary browser origins with credentials enabled.
      Pass explicit allowed origins instead of `"*"`.
    severity: ERROR
    languages: [regex]
    paths:
      include:
        - "Dockerfile"
        - "*Dockerfile*"
        - "*.dockerfile"
        - "Procfile"
        - "*.sh"
        - "*.bash"
        - "Makefile"
        - "*.mk"
        - "*.yaml"
        - "*.yml"
        - ".*.yaml"
        - ".*.yml"
        - "*.toml"
        - "*.ps1"
        - "*.py"
        - "justfile"
        - "Taskfile*"
        - ".env"
        - ".env.*"
        - "*.env"
        - "*.tf"
        - "*.tfvars"
        - "*.ini"
        - "*.cfg"
        - "*.conf"
      exclude:
        - "_site"
        - "_site/**"
        - ".github"
        - ".github/**"
        - ".pre-commit-config.yaml"
        - "*adk-security-rules.yaml"
    metadata:
      control_id: L2-03
      rule_pack: adk-core
      layer: "Layer 2: Identity, Auth & Least-Privilege IAM"
      module: "google.adk.cli"
      category: security
      cwe: "CWE-346: Origin Validation Error"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI03"
      core_module: "google.adk.cli"
      title: "Wildcard CORS Origin on ADK CLI Server"
      security_invariant: "ADK CLI servers (adk web and adk api_server) must never pass wildcard '*' to --allow_origins."
      recommended_fix: "Replace --allow_origins='*' with an explicit HTTPS origin allowlist (for example --allow_origins=https://portal.example.com)."
    pattern-regex: '(?m)^(?![ \t]*(?:#|//))(?:(?![ \t]#)[^\n])*?\badk[\s"'',]+(?:web|api_server)\b(?:(?![ \t]#)[^\n]|\\\r?\n(?![ \t]*#))*?--allow_origins(?:[=\s]+|["'']\s*,\s*(?=["'']))(?:["''](?:[^"''\n]*,\s*)?\*(?:\s*,[^"''\n]*)?["'']|(?:[^\s"''#\\,]+,)*\*(?=[,\s"''#\\]|$))'

  - id: adk-dev-ui-container-entrypoint
    message: >-
      [L2-03 | Layer 2 | adk-core] `adk web` (the ADK development UI server,
      which exposes debug trace, session, and builder routes with no built-in
      authentication) is used as a container or deployment entrypoint. Serve an
      application built with `get_fast_api_app(web=False)` or `adk api_server`
      behind authenticated ingress instead.
    severity: WARNING
    languages: [regex]
    paths:
      include:
        - "Dockerfile"
        - "*Dockerfile*"
        - "*.dockerfile"
        - "Procfile"
        - "*.yaml"
        - "*.yml"
        - ".*.yaml"
        - ".*.yml"
      exclude:
        - ".github"
        - ".github/**"
        - ".pre-commit-config.yaml"
        - "*adk-security-rules.yaml"
    metadata:
      control_id: L2-03
      rule_pack: adk-core
      layer: "Layer 2: Identity, Auth & Least-Privilege IAM"
      module: "google.adk.cli"
      category: security
      cwe: "CWE-489: Active Debug Code"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "HIGH"
      owasp_asi: "ASI03"
      core_module: "google.adk.cli"
      title: "ADK Development UI Server Used as Container or Deployment Entrypoint"
      security_invariant: "Container and service entrypoints must never invoke 'adk web' in shared or production environments."
      recommended_fix: "Replace 'adk web' entrypoints with get_fast_api_app(web=False) under uvicorn/gunicorn or 'adk api_server' behind authenticated ingress."
    pattern-regex: '(?m)^(?:[ \t]*(?:CMD|ENTRYPOINT)\b(?:(?![ \t]#)[^\n])*?\badk[\s"'',]+web\b|[ \t]*-?[ \t]*(?:command|entrypoint|args|cmd|run|script)[ \t]*:(?:(?:(?![ \t]#)[^\n])*?\badk[\s"'',]+web\b|[ \t]*(?:[|>][-+]?)?[ \t]*\r?\n(?:[ \t]+-[ \t]*["'']?(?:uv|run|poetry|python3?|-m|sh|bash|-c)["'']?[ \t]*\r?\n)*[ \t]+(?:-?[ \t]*["'']?adk["'']?(?:[\s"'',]+web\b|[ \t]*\r?\n[ \t]*-[ \t]*["'']?web["'']?\b)|(?:uv[ \t]+run[ \t]+|poetry[ \t]+run[ \t]+|exec[ \t]+)?adk[ \t]+web\b))|[ \t]*(?!(?:description|instruction|global_instruction|static_instruction|prompt|summary|notes?|comments?)\b)[a-zA-Z0-9_-]+[ \t]*:[ \t]*(?:(?:exec|(?:uv|poetry|pipenv|pdm)[ \t]+run|sh[ \t]+-c|bash[ \t]+-c)[ \t]+["'']?)?adk[ \t]+web\b|(?![ \t]*(?:#|//))(?:(?![ \t]#)[^\n])*?\[[^\]\n]*?["'']adk["''][ \t]*,[ \t]*["'']web["''])'

