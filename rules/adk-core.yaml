      title: "Remote A2A Isolation & Outbound Metadata Scrubbing"
      security_invariant: "RemoteA2aAgent must keep full_history_when_stateless=False, use HTTPS agent cards, call authenticated A2A endpoints, and never forward raw local session IDs."
      recommended_fix: "Keep RemoteA2aAgent(full_history_when_stateless=False) with an HTTPS agent card, pass config=A2aRemoteAgentConfig(forward_session_id_as_context_id=False or \"namespaced\"), and serve to_a2a() apps behind OIDC or mTLS."
    pattern-either:
