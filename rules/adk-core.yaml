      core_module: "google.adk.tools.skill_toolset"
      title: "Skill & Script Execution Guard (SkillToolset)"
      security_invariant: "Skill script execution must never use host LocalEnvironment, shell=True, raw LLM commands, or adk_inject_state: true frontmatter."
