  - id: adk-tool-unwrapped-untrusted-output
    message: >-
      [L3-02 | Layer 3 | adk-core] An agent registers MCP tools (`McpToolset`,
      `LoadMcpResourceTool`) without an `after_tool_callback`. MCP server and
      resource output is untrusted content that can carry indirect prompt
      injection or Markdown image beacons. Add an `after_tool_callback` that
      fences the output in `<untrusted_tool_output>` tags and strips Markdown
      images, such as a `wrap_tool_output()` helper.
    severity: WARNING
    languages: [python]
    metadata:
      control_id: L3-02
      rule_pack: adk-core
      layer: "Layer 3: Tool, Data Connector & Network Safety"
      module: "google.adk"
      category: security
