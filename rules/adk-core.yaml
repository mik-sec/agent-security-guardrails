      severity_tier: "CRITICAL"
      owasp_asi: "ASI03/ASI04"
      core_module: "google.adk.cli.cli_deploy"
      title: "Keyless Workload Identity & Scoped Deployment Packaging"
      security_invariant: "Deployments must never use static JSON service account keys (GOOGLE_APPLICATION_CREDENTIALS, google_service_account_key), hardcoded GOOGLE_API_KEY env vars, or root extra_packages=['.']."
