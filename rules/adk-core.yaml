# ==============================================================================
# Agent Security Guardrails — Core ADK Ruleset (L1-01..L5-04, rule_pack: adk-core)
#
# This file is the control catalog for scanner/scan_agent_codebase.py (titles,
# severities, fixes) and the declarative mirror of its ADK-specific checks.
# Every rule here targets a google-adk API. Optional packs live next to it:
#
#   rules/mcp.yaml          MCP client/server hardening (DNS rebinding, pinned
#                           and non-auto-approved servers, token passthrough,
#                           schema $ref, sampling, JSON-RPC IDs)
#   rules/gcp-gemini.yaml   Google Cloud + Gemini SDK checks (safety settings,
#                           direct Gemini calls, Model Armor clients, keyless
#                           auth, Terraform service-account keys)
#
# Out of scope (use a general SAST, secrets, and dependency scanner): generic
# code vulnerabilities (SQL injection, SSRF, command injection, unsafe
# deserialization, path traversal), committed secrets, and vulnerable
# dependencies.
#
# Compatible with Opengrep and Semgrep OSS:
#   opengrep scan --config rules/adk-core.yaml <path>
# ==============================================================================

rules:
  # ----------------------------------------------------------------------------
  # L1-01: Layer 1 — Callable InstructionProvider & {var} Interpolation Block
  # ----------------------------------------------------------------------------
  - id: adk-prompt-var-interpolation
    message: >-
      [L1-01 | Layer 1 | adk-core] Detected an f-string or raw '{var}'
      placeholder in an LlmAgent/Agent `instruction` or in a module-level prompt
      constant. ADK's `inject_session_state` interpolates `{var}` and
      `{artifact.*}` tokens from `session.state`, so untrusted state can inject
      instructions or crash the turn with a KeyError. Pass a callable
      InstructionProvider (`def provider(ctx: ReadonlyContext) -> str`), which
      ADK does not interpolate, and fence untrusted values in XML tags followed
      by a closing security reminder.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L1-01
      rule_pack: adk-core
      layer: "Layer 1: Prompt, Model & State Integrity"
      module: "google.adk"
      category: security
      cwe: "CWE-74: Improper Neutralization of Special Elements in Output Used by a Downstream Component"
      owasp_agentic: "ASI01: Agent Goal Hijack"
      owasp_llm: "LLM01:2025 Prompt Injection"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI01"
      core_module: "google.adk"
      title: "Callable InstructionProvider & {var} Interpolation Block"
      security_invariant: "System instructions must be invariant to untrusted session state; all dynamic context must be wrapped in <untrusted_context> with a 3-Part Sandwich Defense closing <security_postamble>."
      recommended_fix: "Replace f-strings and raw '{var}' placeholders with a callable InstructionProvider(ctx: ReadonlyContext) that fences untrusted values in XML tags."
    pattern-either:
      - pattern: LlmAgent(..., instruction=f"...", ...)
      - pattern: Agent(..., instruction=f"...", ...)
      - pattern: LlmAgent(..., global_instruction=f"...", ...)
      - pattern: Agent(..., global_instruction=f"...", ...)
      - pattern: inject_session_state(..., use_jinja2=True, ...)
      - patterns:
          - pattern-either:
              - pattern: LlmAgent(..., instruction="$INSTR", ...)
              - pattern: Agent(..., instruction="$INSTR", ...)
          - metavariable-regex:
              metavariable: $INSTR
              regex: '(?s)^(?:```(?:(?!```)[\s\S])*```|`[^`\n]+`|\{\{[^}]*\}\}|`(?!``)(?![^`\n]*`)|[^{`])*?(?<!\{)\{[a-zA-Z_][a-zA-Z0-9_.:]*\??\}(?!\})'
      - patterns:
          - pattern: $PROMPT_VAR = "$INSTR"
          - metavariable-regex:
              metavariable: $PROMPT_VAR
              regex: "^(?:.*_)?(?:PROMPT|INSTRUCTION|INSTRUCTIONS|SYSTEM_PROMPT)$"
          - metavariable-regex:
              metavariable: $INSTR
              regex: '(?s)^(?:```(?:(?!```)[\s\S])*```|`[^`\n]+`|\{\{[^}]*\}\}|`(?!``)(?![^`\n]*`)|[^{`])*?(?<!\{)\{[a-zA-Z_][a-zA-Z0-9_.:]*\??\}(?!\})'
          - pattern-either:
              - pattern-inside: |
                  import google.adk
                  ...
              - pattern-inside: |
                  import google.adk.$SUB
                  ...
              - pattern-inside: |
                  from google.adk import $IMP
                  ...
              - pattern-inside: |
                  from google.adk.$SUB import $IMP
                  ...
              - pattern-inside: |
                  from google.adk.$SUB.$SUB2 import $IMP
                  ...
              - pattern-inside: |
                  ...
                  LlmAgent(...)
                  ...
              - pattern-inside: |
                  ...
                  Agent(...)
                  ...
              - patterns:
                  - pattern: $PROMPT_VAR = "$INSTR"
                  - metavariable-regex:
                      metavariable: $INSTR
                      regex: "(?s).*(?<!\\{)\\{(?:(?:user|app|temp):[a-zA-Z0-9_.:]+|artifact\\.[a-zA-Z0-9_.:]+|[a-zA-Z_][a-zA-Z0-9_.:]*\\?)\\}(?!\\}).*"
          - pattern-not-inside: |
              $PROMPT_VAR = "$INSTR"
              ...
              <... $PROMPT_VAR.format(...) ...>
          - pattern-not-inside: |
              $PROMPT_VAR = "$INSTR"
              ...
              <... $PROMPT_VAR.format_map(...) ...>

  # ----------------------------------------------------------------------------
  # L1-02: Layer 1 — Pinned Model Version on ADK agents
  # (Gemini SDK safety-threshold checks: optional gcp-gemini pack)
  # ----------------------------------------------------------------------------
  - id: adk-model-missing-safety-config
    message: >-
      [L1-02 | Layer 1 | adk-core] LlmAgent/Agent `model=` uses a mutable model
      alias (`*-latest`, `*-exp`). The model behind an alias can change without
      a code change, silently invalidating safety and behavior evaluations.
      Pin an immutable model version. Gemini safety-threshold and direct
      Gemini SDK checks are in the optional gcp-gemini pack.
    severity: WARNING
    languages: [python]
    metadata:
      control_id: L1-02
      rule_pack: adk-core
      layer: "Layer 1: Prompt, Model & State Integrity"
      module: "google.adk.agents.LlmAgent"
      category: security
      cwe: "CWE-693: Protection Mechanism Failure"
      owasp_agentic: "ASI01: Agent Goal Hijack"
      owasp_llm: "LLM01:2025 Prompt Injection"
      severity_tier: "HIGH"
      owasp_asi: "ASI01"
      core_module: "google.adk.agents.LlmAgent"
      title: "Pinned Model Version & Hardened Safety Thresholds"
      security_invariant: "Model identifier must be pinned to an immutable release version (no '-latest' or '-exp' aliases) and safety thresholds must enforce BLOCK_LOW_AND_ABOVE across all harm categories."
      recommended_fix: "Pin LlmAgent(model=...) to an immutable Gemini release and set generate_content_config=types.GenerateContentConfig(safety_settings=[...]) with HarmBlockThreshold.BLOCK_LOW_AND_ABOVE."
    patterns:
      - pattern-either:
          - pattern: LlmAgent(..., model="$MODEL", ...)
          - pattern: Agent(..., model="$MODEL", ...)
      - metavariable-regex:
          metavariable: $MODEL
          regex: "(?i)^(.*latest.*|.*-exp)$"

  # ----------------------------------------------------------------------------
  # L1-03: Layer 1 — Inline ModelArmorPlugin & ToolCallIntegrityPlugin
  # ----------------------------------------------------------------------------
  - id: adk-guardrail-missing-model-armor
    message: >-
      [L1-03 | Layer 1 | adk-core] `Runner`, `InMemoryRunner`, or `App(root_agent=...)`
      created without `plugins=`. Production ADK apps must register
      `ModelArmorPlugin` (prompt and response screening, including binary
      attachments) and `ToolCallIntegrityPlugin` (HMAC-signed tool calls).
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L1-03
      rule_pack: adk-core
      layer: "Layer 1: Prompt, Model & State Integrity"
      module: "google.adk"
      category: security
      cwe: "CWE-693: Protection Mechanism Failure"
      owasp_agentic: "ASI01: Agent Goal Hijack"
      owasp_llm: "LLM01:2025 Prompt Injection"
      severity_tier: "HIGH"
      owasp_asi: "ASI01"
      core_module: "google.adk.integrations.model_armor.ModelArmorPlugin"
      title: "Inline ModelArmorPlugin, ByteDataItem Screening & Tool-Call HMAC Integrity"
      security_invariant: "Every App and Runner must enforce inline ingress/egress prompt-injection screening (ModelArmorPlugin + ByteDataItem binary screening) and ToolCallIntegrityPlugin HMAC-SHA256 signing."
      recommended_fix: "Register native ModelArmorPlugin(config=ModelArmorConfig(...)) and ToolCallIntegrityPlugin(secret_key=...) on the App or Runner."
    patterns:
      - pattern-either:
          - pattern: Runner(...)
          - pattern: InMemoryRunner(...)
          - pattern: App(..., root_agent=..., ...)
      - pattern-not: Runner(..., plugins=..., ...)
      - pattern-not: Runner(..., app=..., ...)
      - pattern-not: InMemoryRunner(..., plugins=..., ...)
      - pattern-not: App(..., plugins=..., ...)

  # ----------------------------------------------------------------------------
  # L1-04: Layer 1 — Scoped Session State & Colon-Prefix Validation
  # ----------------------------------------------------------------------------
  - id: adk-state-unscoped-colon-mutation
    message: >-
      [L1-04 | Layer 1 | adk-core] Direct mutation of a privileged, global, or
      ADK-internal session state key (`app:*`, `user:*`, `auth:*`, `role:*`,
      `user_id`, `permissions`, `tenant_id`, `sandbox_name`,
      `_code_execution_context`, `_code_executor_input_files`,
      `_adk_activated_skills_*`) via raw `.state[...]` or `.state.update(...)`.
      Colon-prefixed keys bypass `state_schema` validation, and mutating `app:*`
      or `sandbox_name` poisons global state or hijacks sandboxes across tenants.
      Route updates through a validation step such as a `validate_state_delta()`
      helper.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L1-04
      rule_pack: adk-core
      layer: "Layer 1: Prompt, Model & State Integrity"
      module: "google.adk"
      category: security
      cwe: "CWE-668: Exposure of Resource to Wrong Sphere"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM06:2025 Sensitive Information Disclosure"
      severity_tier: "HIGH"
      owasp_asi: "ASI06"
      core_module: "google.adk"
      title: "Scoped Session State & Colon-Prefix Validation"
      security_invariant: "Colon-prefixed and internal session state keys (app:*, user:*, auth:*, role:*, sandbox_name, _code_execution_context, _adk_activated_skills_*) must never be mutated via raw state[...]."
      recommended_fix: "Validate session state updates via a validate_state_delta() helper before writing them."
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CTX.state["$KEY"] = $VAL
              - pattern: $CTX.state['$KEY'] = $VAL
              - pattern: '$CTX.state.update({ "$KEY": $VAL, ... })'
          - metavariable-regex:
              metavariable: $KEY
              regex: "^(app:.*|user:.*|auth:.*|role:.*|user_id|permissions|is_admin|tenant_id|_verified_user_id|sandbox_name|_code_execution_context|_code_executor_input_files|_adk_activated_skills_.*)$"
      - patterns:
          - pattern: |
              $KEY_VAR = "$KEY"
              ...
              $CTX.state[$KEY_VAR] = $VAL
          - metavariable-regex:
              metavariable: $KEY
              regex: "^(app:.*|user:.*|auth:.*|role:.*|user_id|permissions|is_admin|tenant_id|_verified_user_id|sandbox_name|_code_execution_context|_code_executor_input_files|_adk_activated_skills_.*)$"

  # ----------------------------------------------------------------------------
  # L2-01: Layer 2 — Encrypted ADK Credential Store & S256 PKCE
  # (runtime-bound token env checks: optional gcp-gemini pack)
  # ----------------------------------------------------------------------------
  - id: adk-auth-disabled-runtime-bound-token
    message: >-
      [L2-01 | Layer 2 | adk-core] OAuth credentials stored in plaintext ADK
      session state (`SessionStateCredentialService`, or a token written to
      `state[...]`), or an OAuth flow configured with a PKCE
      `code_challenge_method` other than `S256`. Encrypt stored credentials with
      `GOOGLE_CREDENTIAL_KMS_KEY` and enforce S256 PKCE. Runtime-bound token
      environment checks are in the optional gcp-gemini pack.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L2-01
      rule_pack: adk-core
      layer: "Layer 2: Identity, Auth & Least-Privilege IAM"
      module: "GOOGLE_CREDENTIAL_KMS_KEY"
      category: security
      cwe: "CWE-294: Authentication Bypass by Capture-replay"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI03"
      core_module: "google.adk.auth"
      title: "Runtime-Bound Tokens, S256 PKCE & KMS Credential Store"
      security_invariant: "GOOGLE_API_ENABLE_RUNTIME_BOUND_TOKEN must remain 'true', OAuth2 flows must enforce S256 PKCE, and credential stores must bind to a Cloud KMS key (GOOGLE_CREDENTIAL_KMS_KEY)."
      recommended_fix: "Configure GOOGLE_CREDENTIAL_KMS_KEY for the ADK credential service, never write OAuth tokens to session state, and set code_challenge_method='S256'."
    pattern-either:
      - pattern: SessionStateCredentialService(...)
      - pattern: $CTX.state[$KEY] = $CREDS.to_json(...)
      - pattern: $CTX.state["token_cache"][$KEY] = $VAL
      - patterns:
          - pattern-either:
              - pattern: $CTX.state["$TOKEN_KEY"] = $VAL
              - pattern: $CTX.state['$TOKEN_KEY'] = $VAL
          - metavariable-regex:
              metavariable: $TOKEN_KEY
              regex: "(?i).*(access_token|refresh_token|client_secret|token_cache|oauth_token|bearer_token).*"
      - patterns:
          - pattern: $AUTH(..., code_challenge_method=$METHOD, ...)
          - pattern-not: $AUTH(..., code_challenge_method="S256", ...)

  - id: adk-auth-credential-in-tool-signature
    message: >-
      [L2-01 | Layer 2 | adk-core] Tool function `$TOOL` exposes credential
      parameter `$CRED` to LLM population. Passing tokens, API keys, or
      passwords as tool arguments leaks secrets into model prompts, session
      history, and traces. Retrieve runtime-bound credentials server-side from
      the ADK KMS-encrypted credential service via `tool_context`.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L2-01
      rule_pack: adk-core
      layer: "Layer 2: Identity, Auth & Least-Privilege IAM"
      module: "GOOGLE_CREDENTIAL_KMS_KEY"
      category: security
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM02:2025 Sensitive Information Disclosure"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI03/ASI06"
      core_module: "google.adk.auth"
      title: "No Raw Credential Parameters in LLM Tool Signatures"
      security_invariant: "Tool signatures must never accept access_token, bearer_token, api_key, client_secret, or password from the LLM; retrieve credentials server-side via ADK credential services."
      recommended_fix: "Remove credential parameters from the tool signature and fetch scoped credentials server-side via tool_context or Secret Manager."
    patterns:
      - pattern-either:
          - pattern: |
              def $TOOL(..., $CRED: $CT, ..., tool_context: $T, ...):
                ...
          - pattern: |
              def $TOOL(..., tool_context: $T, ..., $CRED: $CT, ...):
                ...
          - pattern: |
              def $TOOL(..., $CRED, ..., tool_context, ...):
                ...
          - pattern: |
              def $TOOL(..., tool_context, ..., $CRED, ...):
                ...
          - patterns:
              - pattern-either:
                  - pattern: |
                      def $TOOL(..., $CRED: $CT, ...):
                        ...
                  - pattern: |
                      def $TOOL(..., $CRED, ...):
                        ...
              - pattern-either:
                  - pattern-inside: |
                      ...
                      FunctionTool($TOOL, ...)
                  - pattern-inside: |
                      ...
                      FunctionTool(..., func=$TOOL, ...)
                  - pattern-inside: |
                      ...
                      LongRunningFunctionTool($TOOL, ...)
                  - pattern-inside: |
                      ...
                      LongRunningFunctionTool(..., func=$TOOL, ...)
                  - pattern-inside: |
                      ...
                      LlmAgent(..., tools=[..., $TOOL, ...], ...)
                  - pattern-inside: |
                      ...
                      Agent(..., tools=[..., $TOOL, ...], ...)
      - metavariable-regex:
          metavariable: $CRED
          regex: '^(?:access_token|refresh_token|bearer_token|id_token|oauth_token|auth_token|api_key|apikey|client_secret|password|passwd|secret_key|private_key)$'
      - pattern-not-inside: |
          @$ROUTER.get(...)
          def $TOOL(...):
            ...
      - pattern-not-inside: |
          @$ROUTER.post(...)
          def $TOOL(...):
            ...
      - pattern-not-inside: |
          @$ROUTER.put(...)
          def $TOOL(...):
            ...
      - pattern-not-inside: |
          @$ROUTER.delete(...)
          def $TOOL(...):
            ...
      - pattern-not-inside: |
          @$ROUTER.patch(...)
          def $TOOL(...):
            ...

  # ----------------------------------------------------------------------------
  # L2-02: Layer 2 — Server-Side Caller Identity Binding & Deny-by-Default RBAC
  # ----------------------------------------------------------------------------
  - id: adk-rbac-llm-controlled-user-id
    message: >-
      [L2-02 | Layer 2 | adk-core] A tool function accepts `user_id` or
      `tenant_id` as an LLM-populated parameter instead of reading the
      authenticated caller from `tool_context.user_id`, or a session service is
      queried with `list_sessions(user_id=None)` across all tenants. Prompt
      injection can spoof the identifier and cause Broken Object Level
      Authorization (BOLA / IDOR). Remove identity parameters from the tool
      signature and bind identity server-side from `tool_context` (for example a
      `bind_authenticated_user(tool_context)` helper).
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L2-02
      rule_pack: adk-core
      layer: "Layer 2: Identity, Auth & Least-Privilege IAM"
      module: "google.adk"
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI03"
      core_module: "google.adk"
      title: "Server-Side Caller Identity Binding & Semantic BOLA Prevention"
      security_invariant: "Tool signatures must never expose user_id, tenant_id, owner_id, account_id, or caller_role to the LLM; all resource queries must join against server-verified tool_context.user_id."
      recommended_fix: "Remove identity parameters from the tool signature, resolve caller identity server-side from tool_context, and always pass user_id to list_sessions()."
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  def $TOOL(..., user_id: str, ..., tool_context: $T, ...):
                      ...
              - pattern: |
                  def $TOOL(..., tool_context: $T, ..., user_id: str, ...):
                      ...
              - pattern: |
                  def $TOOL(..., tenant_id: str, ..., tool_context: $T, ...):
                      ...
              - pattern: |
                  def $TOOL(..., tool_context: $T, ..., tenant_id: str, ...):
                      ...
          - pattern-not-inside: |
              @$ROUTER.get(...)
              def $TOOL(...):
                  ...
          - pattern-not-inside: |
              @$ROUTER.post(...)
              def $TOOL(...):
                  ...
          - pattern-not-inside: |
              @$ROUTER.put(...)
              def $TOOL(...):
                  ...
          - pattern-not-inside: |
              @$ROUTER.delete(...)
              def $TOOL(...):
                  ...
          - pattern-not-inside: |
              @$ROUTER.patch(...)
              def $TOOL(...):
                  ...
      - pattern: $SVC.list_sessions(..., user_id=None, ...)

  # ----------------------------------------------------------------------------
  # L2-03: Layer 2 — Hardened ADK API Server, CORS Lockdown & Trigger Auth
  # ----------------------------------------------------------------------------
  - id: adk-server-unauthenticated-fastapi-app
    message: >-
      [L2-03 | Layer 2 | adk-core] Detected `get_fast_api_app(..., web=True)`,
      wildcard `"*"` in `allow_origins`, trigger endpoints (`trigger_sources=...`),
      or `TriggerRouter(verifier=None)`. ADK's `get_fast_api_app()` mounts `/run`,
      `/run_sse`, session (`state_delta`), and builder routes with no built-in
      authentication, and `"*"` in `allow_origins` disables ADK's Origin and
      DNS-rebinding check while reflecting arbitrary caller origins with
      credentials enabled. Pass `web=False` and an explicit `allow_origins` list,
      put the server behind authenticated ingress (IAP or Cloud Run IAM), and
      verify triggers with `trigger_oidc_audience` +
      `trigger_oidc_service_accounts` (or `GoogleOidcVerifier(audience,
      allowed_emails=[...])`).
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L2-03
      rule_pack: adk-core
      layer: "Layer 2: Identity, Auth & Least-Privilege IAM"
      module: "google.adk"
      category: security
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp_agentic: "ASI03: Identity & Privilege Abuse"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI03"
      core_module: "google.adk.cli.fast_api"
      title: "Hardened FastAPI Server, Strict CORS & state_delta Middleware"
      security_invariant: "FastAPI servers must disable unauthenticated web UI (web=False), reject wildcard CORS ('*'), sanitize HTTP state_delta, and verify trigger OIDC tokens against an explicit service-account allowlist (trigger_oidc_service_accounts or GoogleOidcVerifier allowed_emails)."
      recommended_fix: "Configure get_fast_api_app(web=False, allow_origins=[<explicit origins>]), serve it behind authenticated ingress, validate client state_delta with validate_state_delta(), and pass trigger_oidc_audience plus a non-empty trigger_oidc_service_accounts list (or GoogleOidcVerifier(audience, allowed_emails=[...])) for triggers."
    pattern-either:
      - pattern: get_fast_api_app(..., web=True, ...)
      - pattern: $M.get_fast_api_app(..., web=True, ...)
      - patterns:
          - pattern-inside: |
              $W = True
              ...
          - pattern-either:
              - pattern: get_fast_api_app(..., web=$W, ...)
              - pattern: $M.get_fast_api_app(..., web=$W, ...)
      - pattern: get_fast_api_app(..., allow_origins=[..., "*", ...], ...)
      - pattern: $M.get_fast_api_app(..., allow_origins=[..., "*", ...], ...)
      - patterns:
          - pattern-inside: |
              $X = [..., "*", ...]
              ...
          - pattern-either:
              - pattern: get_fast_api_app(..., allow_origins=$X, ...)
              - pattern: $M.get_fast_api_app(..., allow_origins=$X, ...)
      - patterns:
          - pattern-either:
              - pattern: get_fast_api_app(..., trigger_sources=$TS, ...)
              - pattern: $M.get_fast_api_app(..., trigger_sources=$TS, ...)
          - pattern-not: get_fast_api_app(..., trigger_sources=None, ...)
          - pattern-not: $M.get_fast_api_app(..., trigger_sources=None, ...)
          - pattern-not: get_fast_api_app(..., trigger_sources=[], ...)
          - pattern-not: $M.get_fast_api_app(..., trigger_sources=[], ...)
          - pattern-not: get_fast_api_app(..., trigger_sources=(), ...)
          - pattern-not: $M.get_fast_api_app(..., trigger_sources=(), ...)
          - pattern-not: get_fast_api_app(..., trigger_auth_verifier=$VERIFIER, ...)
          - pattern-not: $M.get_fast_api_app(..., trigger_auth_verifier=$VERIFIER, ...)
          - pattern-not: get_fast_api_app(..., trigger_oidc_audience=$AUD, trigger_oidc_service_accounts=[$SA, ...], ...)
          - pattern-not: $M.get_fast_api_app(..., trigger_oidc_audience=$AUD, trigger_oidc_service_accounts=[$SA, ...], ...)
      - pattern: TriggerRouter(..., verifier=None, ...)
      - pattern: $M.TriggerRouter(..., verifier=None, ...)

  # ----------------------------------------------------------------------------
  # L3-01: Layer 3 — Programmatic HITL Confirmation & Strict Input Schemas
  # ----------------------------------------------------------------------------
  - id: adk-tool-missing-hitl-confirmation
    message: >-
      [L3-01 | Layer 3 | adk-core] State-mutating `FunctionTool` (`delete_*`,
      `update_*`, `grant_*`, `transfer_*`, `execute_*`, `send_*`, `approve_*`,
      `write_*`) or write-capable `ApplicationIntegrationToolset` registered
      without `require_confirmation=True`, or `GCSAdminToolset` registered
      without a `tool_filter` allowlist. Autonomous state mutation completes the
      lethal trifecta. Use `FunctionTool(func, require_confirmation=True)` or
      `tool_context.request_confirmation()`, and restrict `GCSAdminToolset` to
      read-only tools with `tool_filter=[...]`.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L3-01
      rule_pack: adk-core
      layer: "Layer 3: Tool, Data Connector & Network Safety"
      module: "google.adk"
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp_agentic: "ASI02: Tool Misuse & Exploitation"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI02/ASI09"
      core_module: "google.adk.tools.FunctionTool"
      title: "Programmatic HITL Confirmation & Static Tool Splitting"
      security_invariant: "Every state-mutating tool must enforce require_confirmation=True (or a secondary intent verifier) to break Leg 3 of the Lethal Trifecta."
      recommended_fix: "Wrap state-mutating functions with FunctionTool(fn, require_confirmation=True) or call tool_context.request_confirmation(); restrict GCSAdminToolset with tool_filter=[...]."
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: FunctionTool($FUNC)
              - pattern: FunctionTool(func=$FUNC)
              - pattern: FunctionTool($FUNC, require_confirmation=False, ...)
              - pattern: FunctionTool(func=$FUNC, require_confirmation=False, ...)
          - pattern-not: FunctionTool(..., require_confirmation=True, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: "^(delete_|remove_|destroy_|drop_|update_|modify_|grant_|revoke_|transfer_|execute_|write_|send_|approve_).*"
      - patterns:
          - pattern: ApplicationIntegrationToolset(...)
          - pattern-not: ApplicationIntegrationToolset(..., require_confirmation=True, ...)
      - pattern-either:
          - patterns:
              - pattern: GCSAdminToolset(...)
              - pattern-not: GCSAdminToolset(..., tool_filter=$FILTER, ...)
          - pattern: GCSAdminToolset(..., tool_filter=None, ...)

  - id: adk-tool-unconstrained-kwargs
    message: >-
      [L3-01 | Layer 3 | adk-core] Registered ADK tool function `$TOOL` accepts
      unconstrained `**$KW` keyword arguments, bypassing strict tool input
      schema validation and letting a prompt-injected model pass unexpected
      arguments to downstream APIs. Declare explicit, strictly typed parameters
      on every agent tool.
    severity: WARNING
    languages: [python]
    metadata:
      control_id: L3-01
      rule_pack: adk-core
      layer: "Layer 3: Tool, Data Connector & Network Safety"
      module: "google.adk"
      category: security
      cwe: "CWE-20: Improper Input Validation"
