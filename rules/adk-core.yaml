    patterns:
      - pattern: $DEPLOY(..., extra_packages=[..., "$PKG", ...], ...)
      - metavariable-regex:
          metavariable: $PKG
          regex: "^(\\.|\\./|)$"

  # ----------------------------------------------------------------------------
  # Declarative ADK YAML & Skill Markdown Config Rules (adk-core)
  # ----------------------------------------------------------------------------
  - id: adk-prompt-var-interpolation-yaml
    message: >-
      [L1-01 | Layer 1 | adk-core] Declarative ADK agent YAML `instruction`
      contains an unescaped `{var}` or `{var?}` session-state placeholder. Escape
      literal braces or move dynamic context into a Python `InstructionProvider`.
    severity: ERROR
    languages: [yaml]
    paths:
      exclude:
        - "*cloudbuild*"
        - ".github/**"
        - ".pre-commit-config.yaml"
        - "*semgrep*"
    metadata:
      control_id: L1-01
      rule_pack: adk-core
      layer: "Layer 1: Model, Prompt & Context Integrity"
      module: "google.adk.utils.instructions_utils"
      category: security
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command"
      owasp_agentic: "ASI01: Agent Goal Hijack"
      owasp_llm: "LLM01:2025 Prompt Injection"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI01"
      core_module: "google.adk.utils.instructions_utils"
      title: "Safe Instruction Provider & Context Data Fencing"
      security_invariant: "System instructions must be static strings without {var} placeholders or callable InstructionProvider functions; untrusted context must be XML-fenced."
      recommended_fix: "Replace string instruction templates containing {var} with a callable InstructionProvider(ReadonlyContext) -> str."
    patterns:
      - pattern-either:
          - pattern: |
              ...
              instruction: $INSTR
              ...
          - pattern: |
              ...
              global_instruction: $INSTR
              ...
          - pattern: |
              ...
              static_instruction: $INSTR
              ...
      - pattern-either:
          - pattern: |
              ...
              model: $MODEL
              ...
          - pattern: |
              ...
              agent_class: $ACLS
              ...
          - pattern: |
              ...
              sub_agents: $SUBS
              ...
          - pattern: |
              ...
              tools: $TOOLS
              ...
      - metavariable-regex:
          metavariable: $INSTR
          regex: '(?s)^(?:```(?:(?!```)[\s\S])*```|`[^`\n]+`|\{\{[^}]*\}\}|`(?!``)(?![^`\n]*`)|[^{`])*?(?<!\{)\{[a-zA-Z_][a-zA-Z0-9_.:]*\??\}(?!\})'
      - focus-metavariable: $INSTR

  - id: adk-prompt-var-interpolation-skill-md
    message: >-
      [L1-01 | Layer 1 | adk-core] `SKILL.md` enables state/tool injection in
      frontmatter (`adk_inject_state: true` or `allowed-tools` /
      `adk_additional_tools`) and interpolates an unescaped `{var}` template
      variable in the skill prompt body.
    severity: ERROR
    languages: [regex]
    paths:
      include:
        - "SKILL.md"
        - "**/SKILL.md"
    metadata:
      control_id: L1-01
      rule_pack: adk-core
      layer: "Layer 1: Model, Prompt & Context Integrity"
      module: "google.adk.utils.instructions_utils"
      category: security
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command"
      owasp_agentic: "ASI01: Agent Goal Hijack"
      owasp_llm: "LLM01:2025 Prompt Injection"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI01"
      core_module: "google.adk.utils.instructions_utils"
      title: "Safe Instruction Provider & Context Data Fencing"
      security_invariant: "System instructions must be static strings without {var} placeholders or callable InstructionProvider functions; untrusted context must be XML-fenced."
      recommended_fix: "Remove adk_inject_state: true or escape {var} placeholders in SKILL.md prompt bodies."
    pattern-regex: '(?ms)\A---\r?\n(?:(?!^(?:---|\.\.\.)\s*$)[\s\S])*?(?:\badk_inject_state\s*:\s*(?:true|yes|1)\b|^[ \t]*(?:allowed-tools|adk_additional_tools)\s*:)[\s\S]*?^(?:---|\.\.\.)[ \t]*\r?\n(?:```(?:(?!```)[\s\S])*```|`[^`\n]+`|\$\$(?:(?!\$\$)[\s\S])*\$\$|\$[^$\n]+\$|\\[a-zA-Z]+(?:\{[^{}]*\})+|\{\{[^}]*\}\}|[^{`\\$]|\\(?![a-zA-Z]+\{).)*?(?<![a-zA-Z0-9_\\{`$])\{[a-zA-Z_][a-zA-Z0-9_.:]*\??\}(?![}`$])'

  - id: adk-skill-unvalidated-script-execution-config
    message: >-
      [L3-05 | Layer 3 | adk-core] Skill or agent configuration enables
      `adk_inject_state: true` or declares `allowed-tools` /
      `adk_additional_tools` in frontmatter without host allowlist validation.
    severity: ERROR
    languages: [regex]
    paths:
