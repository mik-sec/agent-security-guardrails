      owasp_asi: "ASI02"
      core_module: "google.adk.tools.FunctionTool"
      title: "Strict Typed Tool Input Schemas Without Wildcard **kwargs"
      security_invariant: "Registered ADK tool functions must declare explicit typed parameters and never accept arbitrary **kwargs from the LLM."
      recommended_fix: "Replace **kwargs on registered ADK tool functions with explicit typed parameters or a validated Pydantic model."
    patterns:
      - metavariable-regex:
          metavariable: $TOOL
          regex: '^[A-Za-z]'
      - pattern-either:
          - patterns:
              - pattern: |
                  def $TOOL(..., **$KW):
                    ...
              - pattern-either:
                  - pattern-inside: |
                      ...
                      FunctionTool($TOOL, ...)
                  - pattern-inside: |
                      ...
                      FunctionTool(..., func=$TOOL, ...)
                  - pattern-inside: |
                      ...
                      LongRunningFunctionTool($TOOL, ...)
                  - pattern-inside: |
                      ...
                      LongRunningFunctionTool(..., func=$TOOL, ...)
                  - pattern-inside: |
                      ...
                      LlmAgent(..., tools=[..., $TOOL, ...], ...)
                  - pattern-inside: |
                      ...
                      Agent(..., tools=[..., $TOOL, ...], ...)
          - patterns:
              - pattern: |
                  def $TOOL(..., tool_context: $T, ..., **$KW):
                    ...
              - metavariable-regex:
                  metavariable: $T
                  regex: '^(?:.*\.)?ToolContext$'

  # ----------------------------------------------------------------------------
