      (`extra_packages=["."]`), shipping `.env` files, local credentials, and
      tests into the deployed agent. Package only the agent directory
      (`extra_packages=["./my_agent"]`). Static service-account key and
      `env_vars` secret checks are in the optional gcp-gemini pack; scan for
      committed key material with a secrets scanner.
