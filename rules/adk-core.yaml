      recommended_fix: "Sanitize artifact names with os.path.basename(), reject 'user:'/'app:' prefixes, and check MIME type, magic bytes, and size before save_artifact()."
    pattern-either:
      - pattern: SaveFilesAsArtifactsPlugin(...)
      - patterns:
          - pattern-inside: |
              def $FUNC(..., $NAME, ...):
                  ...
          - pattern-either:
              - pattern: $CTX.save_artifact($NAME, ...)
              - pattern: $CTX.save_artifact(filename=$NAME, ...)

  # ----------------------------------------------------------------------------
  # L4-05: Layer 4 — Fail-Closed Multi-Tenant RAG Memory & Scope Isolation
  # ----------------------------------------------------------------------------
  - id: adk-memory-unscoped-rag-corpus
    message: >-
      [L4-05 | Layer 4 | adk-core] Detected `VertexAiRagMemoryService(...)`.
      When a shared RAG corpus exceeds 1,000 files, ADK silently drops the
      per-user `rag_resources` filter and `retrieval_query` searches the entire
      multi-tenant corpus. Use one corpus per tenant, or verify the filter is
      applied and fail closed when it cannot be.
    severity: WARNING
    languages: [python]
    metadata:
      control_id: L4-05
      rule_pack: adk-core
      layer: "Layer 4: Sub-Agent, Sandbox & Artifact Isolation"
      module: "google.adk"
      category: security
      cwe: "CWE-668: Exposure of Resource to Wrong Sphere"
      owasp_agentic: "ASI06: Sensitive Information & Credential Leakage"
      owasp_llm: "LLM02:2025 Sensitive Information Disclosure"
      severity_tier: "HIGH"
      owasp_asi: "ASI06"
      core_module: "google.adk.memory.vertex_ai_rag_memory_service"
      title: "Fail-Closed Multi-Tenant RAG Memory & Scope Isolation"
      security_invariant: "VertexAiRagMemoryService queries must enforce tenant/user scoping and fail closed above the 1,000-file RAG filter ceiling."
      recommended_fix: "Provision one RAG corpus per tenant for VertexAiRagMemoryService, or verify per-user filtering is applied and fail closed when the corpus exceeds 1,000 files."
    pattern: VertexAiRagMemoryService(...)

  # ----------------------------------------------------------------------------
  # L5-01: Layer 5 — Bounded Reasoning Turns, Token Budget & Loop Breaker
  # ----------------------------------------------------------------------------
  - id: adk-budget-unbounded-llm-calls
    message: >-
      [L5-01 | Layer 5 | adk-core] Detected `RunConfig` with `max_llm_calls=0`
      or `max_llm_calls=-1`, `ReflectAndRetryToolPlugin(tracking_scope=TrackingScope.GLOBAL)`,
      or `LoopAgent` without `max_iterations`. Set a strict positive bound
      (`RunConfig(max_llm_calls=20)`, `LoopAgent(max_iterations=5)`) and
      `ReflectAndRetryToolPlugin(max_retries=2, tracking_scope=TrackingScope.INVOCATION)`.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L5-01
      rule_pack: adk-core
      layer: "Layer 5: Resilience, Telemetry & Secure Delivery Gates"
      module: "google.adk"
      category: security
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp_agentic: "ASI08: Cascading Failures & Resource Exhaustion"
      owasp_llm: "LLM10:2025 Unbounded Consumption"
      severity_tier: "MEDIUM"
      owasp_asi: "ASI08"
      core_module: "google.adk.plugins.ReflectAndRetryToolPlugin"
      title: "Bounded Reasoning Turns, Token Budget & Loop Circuit Breaker"
      security_invariant: "RunConfig must specify 1 <= max_llm_calls <= 50 and retry plugins must use TrackingScope.INVOCATION with session token & loop caps."
      recommended_fix: "Configure RunConfig(max_llm_calls=20) and ReflectAndRetryToolPlugin(tracking_scope=TrackingScope.INVOCATION)."
    pattern-either:
      - pattern: RunConfig(..., max_llm_calls=0, ...)
      - pattern: RunConfig(..., max_llm_calls=-1, ...)
      - pattern: types.RunConfig(..., max_llm_calls=0, ...)
      - pattern: types.RunConfig(..., max_llm_calls=-1, ...)
      - pattern: ReflectAndRetryToolPlugin(..., tracking_scope=TrackingScope.GLOBAL, ...)
      - patterns:
          - pattern: LoopAgent(...)
          - pattern-not: LoopAgent(..., max_iterations=..., ...)

  # ----------------------------------------------------------------------------
  # L5-02: Layer 5 — Sensitive Telemetry & Span Lockdown
  # (secrets written to application logs: general SAST)
  # ----------------------------------------------------------------------------
  - id: adk-telemetry-unredacted-spans-or-logs
    message: >-
      [L5-02 | Layer 5 | adk-core] Detected `LoggingPlugin()`,
      `DebugLoggingPlugin()`, or `ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS="true"`.
      These export raw prompts, tool arguments, tokens, and PII to logs and
      telemetry spans. Keep `ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS="false"`, do
      not register the logging plugins in production, and attach a redacting
      `logging.Filter`.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L5-02
      rule_pack: adk-core
      layer: "Layer 5: Resilience, Telemetry & Secure Delivery Gates"
      module: "google.adk"
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp_agentic: "ASI06: Sensitive Information & Credential Leakage"
      owasp_llm: "LLM02:2025 Sensitive Information Disclosure"
      severity_tier: "HIGH"
      owasp_asi: "ASI10"
      core_module: "google.adk"
      title: "Sensitive Telemetry Lockdown & PII/Credential Log Redaction"
      security_invariant: "ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS must be 'false', LoggingPlugin/DebugLoggingPlugin must not be used in production, and logs must redact bearer tokens, API keys, and raw prompts."
      recommended_fix: "Set ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS='false', remove LoggingPlugin/DebugLoggingPlugin from production apps, and attach a redacting logging.Filter."
    pattern-either:
      - pattern: LoggingPlugin(...)
      - pattern: DebugLoggingPlugin(...)
      - pattern: os.environ["ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS"] = "true"
      - pattern: os.environ["ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS"] = "True"

  # ----------------------------------------------------------------------------
  # L5-03: Layer 5 — Agent Config YAML & Service Registry Code-Execution Lock
  # (yaml.load / yaml.unsafe_load in custom code: general SAST)
  # ----------------------------------------------------------------------------
  - id: adk-config-unsafe-yaml-or-service-registry
    message: >-
      [L5-03 | Layer 5 | adk-core] Detected `_ENFORCE_YAML_KEY_DENYLIST = False`
      or a dynamic ADK service registration (`register_memory_service`,
      `register_session_service`, `register_artifact_service`). Disabling the
      agent-config key denylist or registering service factories from
      untrusted configuration lets declarative YAML import arbitrary modules.
      Keep `_ENFORCE_YAML_KEY_DENYLIST = True` and register only allowlisted
      service URIs.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L5-03
      rule_pack: adk-core
      layer: "Layer 5: Resilience, Telemetry & Secure Delivery Gates"
      module: "google.adk.agents.config_agent_utils"
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp_agentic: "ASI05: Unexpected Code Execution (RCE)"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "CRITICAL"
      owasp_asi: "ASI04/ASI05"
      core_module: "google.adk.agents.config_agent_utils"
      title: "Agent Config YAML & Service Registry Code-Execution Lock"
      security_invariant: "_ENFORCE_YAML_KEY_DENYLIST must remain True, YAML parsing must use yaml.safe_load, and agent/service YAML configs must not reference unallowlisted class_path modules or arbitrary args."
      recommended_fix: "Keep ADK _ENFORCE_YAML_KEY_DENYLIST=True, register only allowlisted service URIs, and restrict declarative agent configs to allowlisted tool modules."
    pattern-either:
      - pattern: _ENFORCE_YAML_KEY_DENYLIST = False
      - pattern: get_service_registry().register_memory_service(...)
      - pattern: get_service_registry().register_session_service(...)
      - pattern: get_service_registry().register_artifact_service(...)
      - pattern: $REG.register_memory_service(...)
      - pattern: $REG.register_session_service(...)
      - pattern: $REG.register_artifact_service(...)

  - id: adk-config-runtime-agent-mutation
    message: >-
      [L5-03 | Layer 5 | adk-core] Function `$FUNC` mutates an ADK agent's
      `tools`, `sub_agents`, or `instruction` dynamically at runtime. Mutating a
      live agent definition after initialization enables runtime tool injection
      and cross-request state contamination. Freeze agent toolsets and
      sub-agents at startup and gate per-turn behavior via `InstructionProvider`
      or `before_tool_callback`.
    severity: ERROR
    languages: [python]
    metadata:
      control_id: L5-03
      rule_pack: adk-core
      layer: "Layer 5: Resilience, Telemetry & Secure Delivery Gates"
      module: "google.adk.agents.config_agent_utils"
      category: security
      cwe: "CWE-471: Modification of Assumed-Immutable Data (MAID)"
      owasp_agentic: "ASI04: Supply Chain & Rug-Pull Vulnerabilities"
      owasp_llm: "LLM06:2025 Excessive Agency"
      severity_tier: "HIGH"
      owasp_asi: "ASI04/ASI05"
      core_module: "google.adk.agents"
      title: "Immutable Post-Init ADK Agent Toolsets & Sub-Agents"
      security_invariant: "ADK agent tools, sub_agents, and instruction attributes must not be mutated dynamically inside runtime callbacks or tools."
      recommended_fix: "Declare agent tools and sub_agents statically at initialization and enforce dynamic authorization inside before_tool_callback rather than mutating agent.tools at runtime."
    patterns:
      - pattern-either:
          - pattern-inside: |
              import google.adk
              ...
          - pattern-inside: |
              import google.adk.$SUB
              ...
          - pattern-inside: |
              from google.adk import $IMP
              ...
          - pattern-inside: |
              from google.adk.$SUB import $IMP
              ...
          - pattern-inside: |
              from google.adk.$SUB.$SUB2 import $IMP
              ...
      - pattern-inside: |
          def $FUNC(...):
            ...
      - metavariable-regex:
          metavariable: $FUNC
          regex: '^(?!__init__$|_?set_up$|(?:_)?(?:create|build|make|init|setup|construct|get)_).*'
      - pattern-either:
          - pattern: $AGENT.tools.append(...)
          - pattern: $AGENT.tools.extend(...)
          - pattern: $AGENT.tools.insert(...)
          - pattern: $AGENT.sub_agents.append(...)
          - pattern: $AGENT.sub_agents.extend(...)
          - pattern: $AGENT.sub_agents.insert(...)
          - pattern: $AGENT.instruction = $NEW_INSTR
          - pattern: $AGENT.tools = $NEW_TOOLS
          - pattern: $AGENT.sub_agents = $NEW_SUBAGENTS
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            $AGENT = LlmAgent(...)
            ...
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            $AGENT = Agent(...)
            ...

  # ----------------------------------------------------------------------------
